name: Feature Request
description: Suggest a new component or an improvement to an existing one
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? Who is it for?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the component or change you'd like, including any `@api` properties or events.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Base components, AppExchange packages, or workarounds you've tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, screenshots, or links.
