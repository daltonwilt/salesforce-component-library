<template>
  <ul class="slds-grid slds-wrap slds-gutters_x-small">
    <template for:each={files} for:item="file">
      <li key={file.id} class="slds-col slds-grow-none slds-text-align_center">
        <c-thumbnail
          content-document-id={file.id}
          file-type={file.fileType}
          title={file.title}
          onpreviewfile={handlePreview}
        ></c-thumbnail>
        <p class="slds-var-m-top_xx-small slds-text-body_small">{file.fileType}</p>
      </li>
    </template>
  </ul>

  <template lwc:if={previewed}>
    <p class="slds-var-m-top_small slds-text-body_small">
      Preview requested for <strong>{previewed}</strong>
    </p>
  </template>
</template>
